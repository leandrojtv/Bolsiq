# Configuração do servidor NATS, versionada.
#
# Aqui fica o que é do SERVIDOR: onde o JetStream guarda, quanto pode ocupar,
# porta de monitoração. A definição do STREAM — nome, subjects, retenção,
# janela de deduplicação — **não** fica aqui: está em
# packages/messaging/src/stream.ts e é aplicada pelo serviço na subida, via
# `garantirStream()`.
#
# A divisão é deliberada. O stream é contrato da aplicação: muda junto com o
# catálogo de eventos, e precisa estar no mesmo commit que o código que o usa.
# Descrevê-lo também aqui criaria duas fontes de verdade que divergem no
# primeiro deploy em que alguém esquecer de atualizar uma delas.

server_name: bolsiq-nats
port: 4222

# Porta de monitoração: /healthz, /varz, /jsz.
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  # Tetos do servidor. Os limites por stream estão em stream.ts; estes são o
  # cinto de segurança para o disco do host não encher.
  max_memory_store: 1GB
  max_file_store: 16GB
}

# Sem contas nem usuários: o NATS não está exposto, só a rede interna do
# compose o alcança. Quando o barramento sair da máquina única, isto precisa de
# autenticação — e de um ADR.
