# Ambiente de desenvolvimento. `make up` sobe isto.
#
# Regra 1 do CLAUDE.md: nada aqui depende de instalação local além de Docker.

name: bolsiq-dev

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: bolsiq
      POSTGRES_PASSWORD: bolsiq
      POSTGRES_DB: bolsiq
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsiq -d bolsiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2-alpine
    # Configuração versionada em infra/nats/nats.conf. O stream em si é criado
    # pelo market-data na subida, a partir de packages/messaging/src/stream.ts.
    command: ["-c", "/etc/nats/nats.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-dev:/data
      - ../nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev:
  nats-dev:
