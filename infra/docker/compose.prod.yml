# ESQUELETO. Vale para staging e produção; o que muda entre os dois é o .env,
# injetado pelo workflow deploy.yml a partir do secret ENV_FILE do environment.
#
# Está comentado de propósito: nenhum dos serviços existe ainda. À medida que
# cada um nascer, descomente o bloco correspondente e acrescente a entrada em
# infra/docker/deployables.json — é essa lista que liga o build e o deploy.
#
# Todas as imagens vêm do GHCR pela tag ${IMAGE_TAG}, nunca construídas no host:
# produção roda exatamente o bit que passou por staging.

name: bolsiq

services:
  # Único serviço já utilizável: o Postgres com TimescaleDB.
  postgres:
    image: timescale/timescaledb-ha:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-bolsiq}
    volumes:
      - postgres-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

  nats:
    image: nats:2-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]

