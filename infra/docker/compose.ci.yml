# Compose usado pelos jobs `smoke` e `e2e` do CI.
#
# Sobe as imagens recém-construídas no job `build`, aplica as migrations como
# passo único e espera todos os containers ficarem healthy.
#
# O market-data é publicado na porta 8000, que será a do Kong quando o gateway
# existir (prompt do gateway / ADR 0007). Assim o smoke.sh não muda de endereço
# quando o Kong entrar na frente.

name: bolsiq-ci

services:
  postgres:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: bolsiq
      POSTGRES_PASSWORD: bolsiq
      POSTGRES_DB: bolsiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolsiq -d bolsiq"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/nats.conf"]
    volumes:
      - ../nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20

  alerts-migrate:
    image: bolsiq-alerts-worker:${IMAGE_TAG:-local}
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  alerts-worker:
    image: bolsiq-alerts-worker:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
      NATS_URL: nats://nats:4222
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      nats:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      alerts-migrate:
        condition: service_completed_successfully

  migrate:
    image: bolsiq-market-data:${IMAGE_TAG:-local}
    command: ["node", "node_modules/@bolsiq/db-core/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  market-data:
    image: bolsiq-market-data:${IMAGE_TAG:-local}
    environment:
      ROLE: api
      PORT: "3001"
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
      NATS_URL: nats://nats:4222
      LOG_LEVEL: warn
      SERVICE_VERSION: ${IMAGE_TAG:-local}
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
      # Token de desenvolvimento, so para este compose. Em deploy vem do
      # ENV_FILE do environment (docs/ci-cd.md).
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-troque-em-producao}
    ports:
      - "8000:3001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  market-data-worker:
    image: bolsiq-market-data:${IMAGE_TAG:-local}
    environment:
      ROLE: worker
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
      NATS_URL: nats://nats:4222
      LOG_LEVEL: warn
      BRAPI_TOKEN: ${BRAPI_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  analytics-migrate:
    image: bolsiq-analytics-worker:${IMAGE_TAG:-local}
    command: ["node", "dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  analytics-worker:
    image: bolsiq-analytics-worker:${IMAGE_TAG:-local}
    environment:
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
      NATS_URL: nats://nats:4222
      MARKET_DATA_URL: http://market-data:3001
    depends_on:
      nats:
        condition: service_healthy
      market-data:
        condition: service_healthy
      analytics-migrate:
        condition: service_completed_successfully

  web:
    image: bolsiq-web:${IMAGE_TAG:-local}
    environment:
      # Sem o Kong ainda, o BFF fala direto com o market-data. Com o gateway,
      # muda so esta URL (ADR 0007). A chave fica so no servidor.
      MARKET_DATA_URL: http://market-data:3001
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:-mdk_test_chave_interna_de_desenvolvimento}
      DATABASE_URL: postgres://bolsiq:bolsiq@postgres:5432/bolsiq
      # Sino: o BFF assina alerts.inapp.<user_id> e repassa por SSE.
      NATS_URL: nats://nats:4222
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      FEATURE_TELEGRAM: ${FEATURE_TELEGRAM:-false}
    ports:
      - "3000:3000"
    depends_on:
      market-data:
        condition: service_healthy
      analytics-migrate:
        condition: service_completed_successfully
      alerts-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
